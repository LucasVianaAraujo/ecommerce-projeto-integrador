<header>
    <div id="LogoDoSite">
        <a href=""><h1>LogoDoSite</h1></a>
    </div>
    <div id="BarradePesquisa">
        <input type="search" placeholder="Filtrar por marca, nome ou preço...">
    </div>
    <div id="Interativos">
        <ul class="navbar-list">
        @for(item of itensMenu; track item){
          <li><a [href]="item.link">{{item.label}}</a></li>
        }
      </ul>
        <div id="IconesInterativos">
            <svg lucideHeart></svg>
            <svg lucideShoppingCart></svg>
            <a href="login"><svg lucideUser></svg></a>
        </div>
    </div>
</header>
