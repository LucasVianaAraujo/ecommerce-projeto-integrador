<header class="site-header">
  <div class="header-container" [class.search-active]="isSearchOpen">
    
    <!-- Logo (Desliza suavemente para a esquerda) -->
    <div id="LogoDoSite" routerLink="/home" class="logo-box">
      <img src="/images/logo.png" alt="Old Shoes" />
    </div>

    <!-- Links de Navegação (Compactam texto, mantém ícones) -->
    <nav class="nav-menu">
      <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}" title="Home">
        <mat-icon>home</mat-icon>
        <span class="nav-text">Home</span>
      </a>
      <a routerLink="/produtos" routerLinkActive="active" title="Produtos">
        <mat-icon>inventory_2</mat-icon>
        <span class="nav-text">Produtos</span>
      </a>
      <a routerLink="/marcas" routerLinkActive="active" title="Marcas">
        <mat-icon>sell</mat-icon>
        <span class="nav-text">Marcas</span>
      </a>
      <a routerLink="/ofertas" routerLinkActive="active" title="Ofertas">
        <mat-icon>local_offer</mat-icon>
        <span class="nav-text">Ofertas</span>
      </a>
      <a routerLink="/contato" routerLinkActive="active" title="Contato">
        <mat-icon>mail</mat-icon>
        <span class="nav-text">Contato</span>
      </a>
    </nav>

    <!-- Barra de Pesquisa Central Expansível (Passar o Mouse) -->
    <div 
      class="search-container" 
      [class.open]="isSearchOpen"
      (mouseenter)="openSearch()"
      (mouseleave)="closeSearch()"
    >
      <div class="search-circle">
        <mat-icon class="search-icon">search</mat-icon>
      </div>

      <div class="search-input-wrapper">
        <input 
          type="search" 
          placeholder="O que você está procurando?" 
          #searchInput
        />
        <button type="button" class="submit-search-btn">
          <mat-icon>search</mat-icon>
        </button>
      </div>
    </div>

    <!-- Ações da Direita (Compactam texto, mantém ícones) -->
    <div class="header-actions">
      <a routerLink="/favoritos" class="action-item" title="Favoritos">
        <mat-icon>favorite_border</mat-icon>
        <span class="nav-text">Favoritos</span>
      </a>
      <a routerLink="/carrinho" class="action-item" title="Carrinho">
        <mat-icon>shopping_cart</mat-icon>
        <span class="nav-text">Carrinho</span>
      </a>
      <a routerLink="/login" class="action-item" title="Minha conta">
        <mat-icon>person_outline</mat-icon>
        <span class="nav-text">Minha conta</span>
      </a>
    </div>

  </div>
</header>
