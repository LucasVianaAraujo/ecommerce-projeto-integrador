<header>
    <div id="HeaderPrincipal">

        <div id="LogoDoSite" routerLink="/home">
            <img src="/images/logo.png" alt="Logo">
        </div>

        <div id="BarradePesquisa">
            <input type="search" placeholder="Pesquise aqui!">

            <button class="search-btn" type="button">
                <mat-icon>search</mat-icon>
            </button>
        </div>

        <div id="IconesInterativos">

            <div class="icon-item">
                <mat-icon>favorite</mat-icon>
                <span>Favoritos</span>
            </div>

            <div class="icon-item" routerLink="/carrinho">
                <mat-icon>shopping_cart</mat-icon>
                <span>Carrinho</span>
            </div>

            <div class="icon-item" routerLink="/login">
                <mat-icon>person</mat-icon>
                <span>Minha conta</span>
            </div>

        </div>

    </div>

    <nav id="Menu">
        <a routerLink="/home" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}">Home</a>
        <a routerLink="/produtos" routerLinkActive="active">Produtos</a>
        <a routerLink="/categorias" routerLinkActive="active">Categorias</a>
        <a>Contato</a>

        <div id="MenuDireita">
            <a routerLink="/ofertas-especiais" routerLinkActive="active">Ofertas especiais</a>
        </div>
    </nav>
</header>
