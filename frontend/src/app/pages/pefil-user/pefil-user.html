<div class="background-perfil">
    <div class="conteiner-perfil">

        <!-- Cabeçalho -->
        <header class="perfil-cabecalho">
        <div class="usuario-info">
            <div class="avatar">
            <mat-icon>person</mat-icon>
            </div>
            <div class="usuario-texto">
            <h1>Minha Conta</h1>
            <span class="usuario-email">emailcliente@gmail.com</span>
            </div>
        </div>
        <button class="btn-editar-info" type="button">Editar Informações</button>
        </header>

        <!-- Atalhos -->
        <section class="atalho-section">
        <h2>Atalhos</h2>
        <div class="grid-atalhos">

            <button type="button" class="card-atalho">
            <span class="icon-box"><mat-icon>local_shipping</mat-icon></span>
            <span>Meus Pedidos</span>
            </button>

            <button type="button" class="card-atalho">
            <span class="icon-box"><mat-icon>location_on</mat-icon></span>
            <span>Endereço</span>
            </button>

            <button type="button" class="card-atalho">
            <span class="icon-box"><mat-icon>favorite</mat-icon></span>
            <span>Favoritos</span>
            </button>

            <button type="button" class="card-atalho">
            <span class="icon-box"><mat-icon>star_rate</mat-icon></span>
            <span>Avaliações</span>
            </button>

            <button type="button" class="card-atalho">
            <span class="icon-box"><mat-icon>cancel</mat-icon></span>
            <span>Cancelar Pedido</span>
            </button>

            <button type="button" class="card-atalho">
            <span class="icon-box"><mat-icon>support_agent</mat-icon></span>
            <span>Suporte</span>
            </button>
        </div>
        </section>

        <!-- Secção: Dica de Recuperação de Senha -->
        <section class="secao-dica">
        <h2>Dica de Segurança</h2>
        <div class="card-dica">
            <div class="campo-dica">
            <label for="dica-recuperacao">Dica para Recuperação de Senha</label>
            <div class="input-dica-wrapper">
                <span class="dica-icone"><mat-icon>lightbulb</mat-icon></span>
                <input 
                type="text" 
                id="dica-recuperacao" 
                name="dica-recuperacao" 
                placeholder="Ex: Nome do primeiro animal de estimação"
                >
            </div>
            <span class="dica-aviso">Esta dica será exibida quando solicitar a recuperação de senha.</span>
            </div>
            <button type="button" class="btn-salvar-dica">Guardar Dica</button>
        </div>
        </section>

         <!-- Últimos Pedidos -->
        <section class="section-pedidos">
        <h2>Últimos Pedidos</h2>
        <div class="lista-pedidos">

            <div class="card-pedido">
            <div class="pedido-info"></div>
            <button type="button" class="btn-cancelar-pedido">Cancelar Pedido</button>
            </div>
            
            <div class="card-pedido">
            <div class="pedido-info"></div>
            <button type="button" class="btn-cancelar-pedido">Cancelar Pedido</button>
            </div>

            <div class="card-pedido">
            <div class="pedido-info"></div>
            <button type="button" class="btn-cancelar-pedido">Cancelar Pedido</button>
            </div>

            <div class="card-pedido">
            <div class="pedido-info"></div>
            <button type="button" class="btn-cancelar-pedido">Cancelar Pedido</button>
            </div>

        </div>
        </section>
    </div>
</div>
